<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>3안 글자만으로 15초</title>
<link rel="stylesheet" href="lib/base.css">
<style>
.bg{position:absolute;inset:0;opacity:0}
.bg.yellow{background:var(--marker)}
.bg.black{background:var(--ink)}
.bg.white{background:var(--paper)}
.bg.white .paper{inset:-120px}
.cut{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0}
.word{font-family:var(--display);font-weight:900;letter-spacing:-.04em;line-height:1;white-space:nowrap;display:inline-block}
.h .word{font-size:340px}
.v .word{font-size:260px}
.word.mid{font-size:280px}
.v .word.mid{font-size:220px}
.on-black .word,.on-black .small{color:#fff}
.small{font-family:var(--display);font-weight:800;font-size:70px;margin-top:34px;letter-spacing:-.02em}
.v .small{font-size:66px}
.word .red{color:var(--red)}
.idx{font-family:Consolas,monospace;font-weight:700;font-size:56px;margin-bottom:64px;letter-spacing:.06em}
.v .idx{font-size:52px;margin-bottom:60px}
.row{display:flex;align-items:center;gap:28px;font-family:var(--display);font-weight:900;font-size:104px;letter-spacing:-.03em}
.v .row{flex-direction:column;gap:6px;font-size:130px}
.row i{font-style:normal;color:var(--red);font-size:.7em}
.v .row i{transform:rotate(90deg);font-size:.5em}
.one{font-size:520px}
.v .one{font-size:440px}
.c6 .one{color:var(--marker)}
.c6 .small{color:#fff}
.mark{--mark-h:28%}
.ticker{position:absolute;left:0;right:0;bottom:0;background:var(--ink);color:#fff;overflow:hidden;white-space:nowrap;font-family:var(--display);font-weight:800}
.h .ticker{height:72px;font-size:34px;line-height:72px}
.v .ticker{height:86px;font-size:38px;line-height:86px}
.ticker .run{display:inline-block}
.ticker b{color:var(--marker);font-weight:800;margin:0 28px}
.end .logo{height:70px;margin-bottom:56px}
.v .end .logo{height:76px;margin-bottom:70px}
.end .t1{font-family:var(--display);font-weight:800;font-size:96px;letter-spacing:-.02em;line-height:1.2;text-align:center}
.v .end .t1{font-size:84px}
.end .t2{--mark-h:12%;font-family:var(--display);font-weight:900;font-size:150px;letter-spacing:-.03em;line-height:1.15;margin-top:8px;background:linear-gradient(var(--ink),var(--ink)) 0 96%/0% 12% no-repeat;padding:0 .06em}
.v .end .t2{font-size:128px}
.end .cta{margin-top:70px;font-size:44px;box-shadow:10px 10px 0 #fff}
.end .cta svg{width:40px;height:40px;stroke:var(--marker);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.end .url{margin-top:34px;font-family:var(--body);font-weight:700;font-size:36px}
.h .vbr{display:none}
</style>
</head>
<body>
<div class="stage">
  <div class="bg yellow b0"></div>
  <div class="bg black b1"></div>
  <div class="bg white b2"><div class="paper"></div></div>
  <div class="bg yellow b3"></div>

  <div class="cut c0"><span class="word w0" data-fit=".86">아이디어</span></div>
  <div class="cut c1"><span class="word mid w1" data-fit=".86">있는데,</span></div>
  <div class="cut c2 on-black"><span class="word w2" data-fit=".86">개발자가</span></div>
  <div class="cut c3 on-black"><span class="word w3" data-fit=".86">없다면<span class="red">?</span></span></div>
  <div class="cut c4a"><span class="idx">01</span><span class="word">기획</span></div>
  <div class="cut c4b"><span class="idx">02</span><span class="word">설계</span></div>
  <div class="cut c4c"><span class="idx">03</span><span class="word" data-fit=".86">디자인</span></div>
  <div class="cut c4d"><span class="idx">04</span><span class="word">개발</span></div>
  <div class="cut c4e"><span class="idx">05</span><span class="word">배포</span></div>
  <div class="cut c5"><div class="row"><span>기획</span><i>→</i><span>설계</span><i>→</i><span>디자인</span><i>→</i><span>개발</span><i>→</i><span>배포</span></div></div>
  <div class="cut c6 on-black"><span class="word one">1:1</span><span class="small">실무자와 함께</span></div>
  <div class="cut c7"><span class="word"><span class="count">0</span><span class="unit" style="font-size:.5em">여 개</span></span><span class="small">웹, 앱을 만들어온 팀</span></div>
  <div class="cut c8"><span class="word w8">진짜</span></div>
  <div class="cut c9"><span class="word mark w9" data-fit=".86">서비스로.</span></div>
  <div class="cut c10 end">
    <img class="logo" src="assets/hf-logo.png" alt="">
    <div class="t1">내 아이디어를,<br class="vbr"> 판매할 수 있는</div>
    <div class="t2">진짜 서비스로.</div>
    <span class="cta">내 서비스 상담받기<svg viewBox="0 0 48 48"><path d="M10 24h28M26 12l12 12-12 12"/></svg></span>
    <span class="url">honest-family.com/ai-education</span>
  </div>

  <div class="ticker"><span class="run">AI 부트캠프<b>1:1</b>기획부터 배포까지<b>1:1</b>60여 개 웹, 앱을 만든 팀<b>1:1</b>내 서비스 상담받기<b>1:1</b>AI 부트캠프<b>1:1</b>기획부터 배포까지<b>1:1</b>60여 개 웹, 앱을 만든 팀<b>1:1</b>내 서비스 상담받기<b>1:1</b>AI 부트캠프<b>1:1</b>기획부터 배포까지<b>1:1</b></span></div>
</div>
<script>
window.DURATION = 15;
window.build = ({ tween, stagger }) => {
  const show = (selector, start, end) => {
    tween(selector, start, 0, { opacity: [0, 1] }, "linear");
    if (end !== undefined) tween(selector, end, 0, { opacity: [1, 0] }, "linear");
  };
  show(".b0", 0, 2.0);
  show(".b1", 2.0, 4.0);
  show(".b0", 4.0, 6.8);
  show(".b1", 6.8, 8.0);
  show(".b0", 8.0, 9.6);
  show(".b2", 9.6, 11.6);
  show(".b3", 11.6);

  const slam = (selector, start, hold) => {
    tween(selector, start, 0.22, { scale: [1.4, 1] }, "expo");
    tween(selector, start + 0.22, hold - 0.22, { scale: [1, 1.05] }, "linear");
  };
  show(".c0", 0, 1.0); slam(".w0", -0.12, 1.12);
  show(".c1", 1.0, 2.0); slam(".w1", 1.0, 1.0);
  tween(".w1", 1.0, 0.3, { x: [-120, 0] }, "expo");
  show(".c2", 2.0, 3.0); slam(".w2", 2.0, 1.0);
  show(".c3", 3.0, 4.0); slam(".w3", 3.0, 1.0);
  [".c4a", ".c4b", ".c4c", ".c4d", ".c4e"].forEach((selector, index) => {
    const start = 4.0 + index * 0.4;
    show(selector, start, start + 0.4);
    tween(`${selector} .word`, start, 0.2, { scale: [1.35, 1], sx: [1.15, 1] }, "expo");
    tween(`${selector} .idx`, start, 0.2, { y: [30, 0] }, "expo");
  });
  show(".c5", 6.0, 6.8);
  stagger(".c5 .row > *", 6.0, 0.05, 0.25, { opacity: [0, 1], y: [40, 0] }, "expo");
  show(".c6", 6.8, 8.0);
  tween(".c6 .one", 6.8, 0.3, { scale: [1.6, 1], rot: [-6, 0] }, "expo");
  tween(".c6 .one", 7.1, 0.9, { scale: [1, 1.06] }, "linear");
  tween(".c6 .small", 7.15, 0.3, { opacity: [0, 1], y: [30, 0] }, "expo");
  show(".c7", 8.0, 9.6);
  tween(".c7 .count", 8.0, 0.9, { count: [0, 60] }, "out");
  tween(".c7 .unit", 8.7, 0.25, { opacity: [0, 1], x: [-20, 0] }, "expo");
  tween(".c7 .small", 8.75, 0.3, { opacity: [0, 1], y: [30, 0] }, "expo");
  show(".c8", 9.6, 10.4); slam(".w8", 9.6, 0.8);
  show(".c9", 10.4, 11.6);
  tween(".w9", 10.4, 0.25, { scale: [1.3, 1] }, "expo");
  tween(".w9", 10.6, 0.5, { mark: [0, 100] }, "inOut");
  show(".c10", 11.6);
  tween(".c10 .logo", 11.6, 0.35, { opacity: [0, 1], y: [-20, 0] });
  tween(".c10 .t1", 11.7, 0.4, { opacity: [0, 1], y: [40, 0] }, "expo");
  tween(".c10 .t2", 11.9, 0.45, { opacity: [0, 1], y: [50, 0] }, "expo");
  tween(".c10 .t2", 12.4, 0.5, { mark: [0, 100] }, "inOut");
  tween(".c10 .cta", 12.6, 0.45, { opacity: [0, 1], scale: [0.8, 1] }, "back");
  tween(".c10 .url", 12.85, 0.4, { opacity: [0, 1] });
  tween(".ticker .run", 0, 15, { x: [0, -1400] }, "linear");
};
</script>
<script src="lib/engine.js"></script>
</body>
</html>
