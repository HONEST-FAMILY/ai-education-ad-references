<script>
window.DURATION = 24;
(() => {
  const loop = document.querySelector(".s3 .loop");
  const points = [];
  for (let i = 0; i <= 600; i++) {
    const u = i / 600;
    const x = 160 + 860 * u + 120 * Math.cos(u * Math.PI * 12 + Math.PI);
    const y = 380 + 150 * Math.sin(u * Math.PI * 12) * (0.55 + 0.45 * Math.sin(u * Math.PI));
    points.push(`${x.toFixed(1)} ${y.toFixed(1)}`);
  }
  loop.setAttribute("d", `M${points.join("L")}`);
})();

window.build = ({ tween, stagger, hooks }) => {
  const stageBox = document.querySelector(".stage").getBoundingClientRect();
  const lidBox = document.querySelector(".s5 .screenrect").getBoundingClientRect();
  const unit = lidBox.width / 608;
  const screen = document.querySelector(".s5 .screen");
  screen.style.left = `${lidBox.left - stageBox.left + 16 * unit}px`;
  screen.style.top = `${lidBox.top - stageBox.top + 16 * unit}px`;
  screen.style.width = `${lidBox.width - 32 * unit}px`;
  screen.style.height = `${lidBox.height - 32 * unit}px`;
  const paper = document.querySelector(".paper");
  hooks.push((t) => { paper.style.transform = `translate(${-t * 5}px, ${-t * 3}px)`; });
  tween(".minilogo", -0.5, 0.5, { opacity: [0, 1] });
  tween(".minilogo", 21.1, 0.4, { opacity: [1, 0] });

  tween(".s1", 0, 0.01, { opacity: [1, 1] });
  stagger(".s1 .d3", 0.15, 0.12, 0.6, { draw: [0, 1] }, "inOut");
  stagger(".s1 .d2[pathLength]", 0.95, 0.15, 0.55, { draw: [0, 1] }, "inOut");
  tween(".s1 .d2.fillm", 1.2, 0.3, { opacity: [0, 1] });
  stagger(".s1 .d1", -1.0, 0.15, 0.6, { draw: [0, 1] }, "inOut");
  tween(".s1 .say .mask:first-of-type > span", -0.6, 0.6, { yp: [110, 0] }, "expo");
  tween(".s1 .say .mask:last-of-type > span", 1.0, 0.6, { yp: [110, 0] }, "expo");
  tween(".s1 .say .mark", 1.7, 0.5, { mark: [0, 100] }, "inOut");
  tween(".s1 .bulb", 2.3, 0.45, { opacity: [0, 1], scale: [0.4, 1], y: [40, 0] }, "back");
  stagger(".s1 .b1", 2.3, 0.1, 0.4, { draw: [0, 1] });
  tween(".s1 .b2", 2.75, 0.35, { draw: [0, 1] });
  tween(".s1 .art", 3.8, 0.6, { scale: [1, 1.25], opacity: [1, 0], y: [0, -60] }, "in");
  tween(".s1 .say", 3.85, 0.4, { opacity: [1, 0] }, "in");
  tween(".s1", 4.4, 0.01, { opacity: [1, 0] });

  tween(".s2", 4.25, 0.25, { opacity: [0, 1] });
  tween(".s2 .art", 4.25, 0.6, { scale: [0.85, 1] }, "out");
  stagger(".s2 .c1", 4.3, 0.12, 0.8, { draw: [0, 1] }, "inOut");
  tween(".s2 .cloudfill", 4.75, 0.45, { opacity: [0, 1] });
  stagger(".s2 .c2[pathLength]", 5.0, 0.1, 0.45, { draw: [0, 1] }, "inOut");
  tween(".s2 .c2.fillm", 5.6, 0.3, { opacity: [0, 1] });
  stagger(".s2 .say .mask > span", 5.0, 0.16, 0.6, { yp: [110, 0] }, "expo");
  stagger(".s2 .c3", 6.6, 0.25, 0.5, { draw: [0, 1] }, "inOut");
  tween(".s2", 8.1, 0.35, { opacity: [1, 0] }, "in");

  tween(".s3", 8.35, 0.25, { opacity: [0, 1] });
  tween(".s3 .dot", 8.35, 0.3, { opacity: [0, 1], scale: [0, 1] }, "back");
  tween(".s3 .loop", 8.5, 2.2, { draw: [0, 1] }, "inOut");
  stagger(".s3 .say .mask > span", 8.6, 0.16, 0.6, { yp: [110, 0] }, "expo");
  tween(".s3 .art", 10.9, 0.6, { opacity: [1, 0.15] });
  tween(".s3", 11.55, 0.3, { opacity: [1, 0] }, "in");

  tween(".s4", 11.8, 0.25, { opacity: [0, 1] });
  tween(".s4 .route", 11.9, 1.4, { draw: [0, 1] }, "inOut");
  const nodes = [...document.querySelectorAll(".s4 .node")];
  nodes.forEach((node, index) => {
    const start = 12.5 + index * 0.75;
    tween(node.querySelector(".ring"), start, 0.4, { opacity: [0, 1] });
    tween(node.querySelector(".ico"), start + 0.05, 0.45, { opacity: [0, 1] });
    tween(node.querySelector("text"), start + 0.15, 0.4, { opacity: [0, 1] });
  });
  tween(".s4 .walkers", 12.4, 4.6, { x: [0, 860] }, "inOut");
  tween(".s4 .walkers", 12.4, 0.4, { opacity: [0, 1] });
  stagger(".s4 .say .mask > span", 12.2, 0.16, 0.6, { yp: [110, 0] }, "expo");
  tween(".s4 .say .mark", 13.0, 0.5, { mark: [0, 100] }, "inOut");
  tween(".s4", 17.55, 0.3, { opacity: [1, 0] }, "in");

  tween(".s5", 17.8, 0.25, { opacity: [0, 1] });
  stagger(".s5 .lap", 17.85, 0.15, 0.6, { draw: [0, 1] }, "inOut");
  stagger(".s5 .sk", 18.5, 0.1, 0.45, { draw: [0, 1] }, "inOut");
  tween(".s5 .screen", 19.3, 0.01, { opacity: [0, 1] });
  tween(".s5 .screen", 19.3, 0.7, { clipR: [100, 0] }, "inOut");
  tween(".s5 .sk", 19.9, 0.2, { opacity: [1, 0] });
